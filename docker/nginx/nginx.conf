events {}

http {
  # DNS interno do Docker: reavalia as réplicas do serviço "app" quando elas mudam
  resolver 127.0.0.11 valid=5s ipv6=off;

  upstream app {
    zone app 64k;
    server app:3000 resolve;
  }

  log_format json escape=json '{"time":"$time_iso8601","status":$status,"method":"$request_method",'
                              '"path":"$uri","upstream":"$upstream_addr","duration_s":$request_time,'
                              '"correlation_id":"$sent_http_x_correlation_id"}';
  access_log /dev/stdout json;

  server {
    listen 80;
    location / {
      proxy_pass http://app;
      proxy_set_header Host $host;
      proxy_set_header X-Correlation-Id $http_x_correlation_id;
      # réplica parada não responde: falha rápido e tenta a próxima (só para GET/HEAD idempotentes;
      # o nginx não repete POST por padrão — a idempotência de escrita é garantida pela aplicação)
      proxy_connect_timeout 1s;
      proxy_next_upstream error timeout http_502 http_503;
      proxy_next_upstream_tries 3;
    }
  }
}
