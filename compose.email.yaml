# Entrega REAL dos alertas por e-mail (opcional). Uso:
#   docker compose -f compose.yaml -f compose.email.yaml --profile observability up -d
# O Mailpit continua guardando a cópia local (evidência) e retransmite cada mensagem ao
# SMTP real. Credenciais SÓ no .env (nunca versionado) — ver .env.example.
services:
  mailpit:
    environment:
      MP_SMTP_RELAY_HOST: ${SMTP_RELAY_HOST:?defina SMTP_RELAY_HOST no .env}
      MP_SMTP_RELAY_PORT: ${SMTP_RELAY_PORT:-587}
      MP_SMTP_RELAY_STARTTLS: "true"
      MP_SMTP_RELAY_AUTH: plain
      MP_SMTP_RELAY_USERNAME: ${SMTP_RELAY_USERNAME:?defina SMTP_RELAY_USERNAME no .env}
      MP_SMTP_RELAY_PASSWORD: ${SMTP_RELAY_PASSWORD:?defina SMTP_RELAY_PASSWORD no .env}
      MP_SMTP_RELAY_ALL: "true"

  grafana:
    environment:
      ALERT_EMAIL_TO: ${ALERT_EMAIL_TO:?defina ALERT_EMAIL_TO no .env}
